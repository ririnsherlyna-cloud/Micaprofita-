# ============================================================
# PENJAGA-WAKTU — lapisan jantung ke-3 MICAPROFITA (V291 → V294)
# Lapisan 1: cron SAKTI 7/15 + cron SADAR-1 */20  (GitHub kadang kelaparan)
# Lapisan 2: jantung mandiri (rantai dispatch antar-slot SAKTI & SADAR-1)
# Lapisan 3: PENJAGA-WAKTU ini — mengukur umur DUA organ:
#   • ruang-hidup/keadaan.json   (SADAR-1)   > 26 mnt → dispatch hidup-sadar1.yml
#   • laporan/sasaran-terkini.json (SAKTI)   > 26 mnt → dispatch sakti-denyut.yml
# V294 (2026-10-07): dulu hanya menonton SADAR-1 — jantung SAKTI macet 130+ mnt
# tanpa disadari penjaga ini. Kini dua organ ditonton, dua tombak darurat.
# Sadar-1 (yang rantainya terbukti hidup tiap 20 mnt) juga menyematkan
# penjaga-jantung ini di tubuhnya sendiri — tak bergantung cron yang kelaparan.
# ============================================================
name: PENJAGA-WAKTU (denyut tak boleh bolong)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: jaga-waktu
  cancel-in-progress: false

jobs:
  jaga:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ukur umur dua organ — tendang yang macet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UMAI=$(python3 - <<'PY'
          import json, urllib.request, time
          from datetime import datetime, timezone
          def umur(path, bidang):
              url = ("https://raw.githubusercontent.com/ririnsherlyna-cloud/Micaprofita-/main/"
                     + path + "?cb=%d") % int(time.time())
              try:
                  d = json.load(urllib.request.urlopen(url, timeout=20))
                  selesai = bidang(d)
                  if selesai:
                      t = datetime.strptime(selesai[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc)
                      return (datetime.now(timezone.utc) - t).total_seconds() / 60.0
              except Exception as e:
                  print("baca-gagal:", e)
              return 9999.0
          umurSadar = umur("ruang-hidup/keadaan.json", lambda d: (d.get("waktu") or {}).get("selesai") or (d.get("waktu") or {}).get("mulai"))
          umurSakti = umur("laporan/sasaran-terkini.json", lambda d: d.get("dihasilkan"))
          print(f"{umurSadar:.1f} {umurSakti:.1f}")
          PY
          )
          SADAR=$(echo "$UMAI" | awk '{print $1}')
          SAKTI=$(echo "$UMAI" | awk '{print $2}')
          echo "umur SADAR-1: ${SADAR} mnt · umur jantung SAKTI: ${SAKTI} mnt"
          if [ "$(python3 -c "print(1 if float('${SADAR}') > 26 else 0)")" = "1" ]; then
            echo "SADAR-1 macet > 26 menit — dispatch darurat"
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hidup-sadar1.yml/dispatches" \
              -d '{"ref":"main"}' && echo "tombak darurat SADAR-1 terkirim"
          else
            echo "SADAR-1 segar"
          fi
          if [ "$(python3 -c "print(1 if float('${SAKTI}') > 26 else 0)")" = "1" ]; then
            echo "JANTUNG SAKTI macet > 26 menit — dispatch darurat"
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sakti-denyut.yml/dispatches" \
              -d '{"ref":"main"}' && echo "tombak darurat SAKTI terkirim"
          else
            echo "JANTUNG SAKTI segar"
          fi
